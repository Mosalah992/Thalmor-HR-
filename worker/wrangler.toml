name = "thalmor-quartermaster"
main = "src/index.js"
# Date kept within wrangler@3's supported range (Node 18 on this machine can't run wrangler@4)
compatibility_date = "2024-09-23"

[vars]
# Armory spreadsheet (native Google Sheet, shared with the service account as Editor)
SHEET_ID = "1McJOIBKWVdOF2L6UDIuR4Z74mDH_Eo8b2e3JLT0OqWg"
# Tab holding the smithing ledger
SMITHING_TAB = "Smithing"
# Comma-separated Discord user IDs allowed to use the commands (quartermaster only)
ALLOWED_USER_IDS = "269093657305415683"

# Secrets (set with `npx wrangler secret put <NAME>` from the worker/ directory):
#   DISCORD_PUBLIC_KEY           - app public key from the Discord Developer Portal
#   GOOGLE_SERVICE_ACCOUNT_JSON  - full contents of credentials/thalmor-service-account.json
