name: Daily clock-in sync

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (print writes, do not modify the sheet)
        type: boolean
        default: false
      log_channel:
        description: Discord channel ID to post the report to (set by /scan and /sync)
        type: string
        default: ''

concurrency:
  group: clockin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: npm test

      - name: Write service-account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Sync clock-ins to roster sheet
        run: node src/sync.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLOCKIN_CHANNEL_ID: ${{ secrets.CLOCKIN_CHANNEL_ID }}
          LOG_CHANNEL_ID: ${{ inputs.log_channel || secrets.LOG_CHANNEL_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
